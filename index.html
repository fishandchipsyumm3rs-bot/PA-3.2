<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <title>PA 3</title>

    <style>
        body {
            background-color: #dff3ff;
            font-family: "Trebuchet MS", sans-serif;
            text-align: center;
            padding: 60px 20px;
            color: #164b83;
        }

        h1 {
            color: #164b83;
            font-size: 40px;
        }

        .container {
            background-color: white;
            max-width: 450px;
            margin: auto;
            padding: 35px;
            border: 4px dashed #ffd84d;
            border-radius: 25px;
            box-shadow: 0 8px 0 #a9d8f5;
        }

        p {
            color: #527da3;
        }

        input[type="text"] {
            width: 85%;
            padding: 12px;
            border: 2px solid #9bcff5;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #ffd84d;
        }

        input[type="button"] {
            background-color: #ffd84d;
            color: #164b83;
            padding: 12px 25px;
            margin-top: 15px;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        input[type="button"]:hover {
            background-color: #ffca28;
            transform: scale(1.05);
        }

        #output {
            margin-top: 25px;
            padding: 15px;
            color: #164b83;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>☀️ Country Finder</h1>
        <p>✦ Find a country and explore the world! ✦</p>

        <form onsubmit="return false;">
            <input type="text" id="input" placeholder="Enter a country...">
            <br>

            <input type="button" py-click="countries" value="Search ✨">
        </form>

        <div id="output"></div>
    </div>

    <script type="py" src="main.py"></script>
</body>
</html>
